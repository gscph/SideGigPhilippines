# Keep rules R8 needs on Release builds (SideGigPh.Maui.csproj: AndroidLinkTool r8). A library that reads Java code
# only by name from .NET (JNI) gives R8 no reason to keep it, so it is removed or renamed and the app crashes there.

# MAUI's MediaPicker (every "choose photos" button) reads the photo picker contracts' Kotlin INSTANCE fields
# (ActivityResultContracts$PickVisualMedia$ImageOnly.INSTANCE). Without this, picking a photo crashes with
# java.lang.NoSuchFieldError ... field "INSTANCE".
-keep class androidx.activity.result.contract.** { *; }
-keep class androidx.activity.result.PickVisualMediaRequest** { *; }
