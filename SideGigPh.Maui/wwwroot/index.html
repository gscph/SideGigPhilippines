<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Tarbaho</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="_content/MobileAppTheme/mobile-app-theme.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="icon" href="data:,">
</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">
        <!-- Pre-Blazor splash: plain HTML because MudBlazor isn't running yet. LaunchRouter renders the same look with MudBlazor. -->
        <div class="app-loading">
            <svg class="app-loading__logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M4.08 3.6H13.2L11.76 7.92H2.64Z" />
                <path fill-opacity="0.78" d="M13.2 3.6H21.36L19.92 7.92H11.76Z" />
                <path fill-opacity="0.62" d="M10.32 7.92H15.12L11.76 20.4H6.96Z" />
                <path d="M10.32 7.92H15.12L13.68 10.8Z" />
            </svg>
            <div class="app-loading__name">Tarbaho</div>
            <div class="app-loading__spinner" aria-hidden="true"></div>
            <div class="app-loading__ai">Powered by AI</div>
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

</body>

</html>
