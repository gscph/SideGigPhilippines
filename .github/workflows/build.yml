name: Build Android & iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  PROJECT: SideGigPh.Maui/SideGigPh.Maui.csproj

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workloads
        run: dotnet workload restore ${{ env.PROJECT }}

      - name: Build Android APK
        run: dotnet publish ${{ env.PROJECT }} -f net10.0-android -c Release /p:AndroidPackageFormat=apk -o ${{ github.workspace }}/output/android

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: output/android/**/*.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workloads
        run: dotnet workload restore ${{ env.PROJECT }}

      - name: Build iOS
        run: dotnet build ${{ env.PROJECT }} -f net10.0-ios -c Release /p:ArchiveOnBuild=false
