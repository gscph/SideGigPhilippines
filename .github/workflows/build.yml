name: Build Android
# The run's title in the Actions list: what is built and from where (the run number shows beside it).
run-name: "Tarbaho ${{ inputs.channel }} from ${{ github.ref_name }}"

# The version is major.minor.patch, worked out from the PRs squashed into main (.github/scripts/app-version.sh: the
# "minor" / "major" label or a "feat:" / "feat!:" title, else the next patch), and this run's number is the Android
# versionCode: run 12 at 0.2.3 builds "0.2.3" with versionCode 12 ("0.2.3-rc.12" while AppVersionStage is rc). The build number keeps counting up, as the
# stores require.
# The download and the file inside carry it too (tarbaho-0.1.0-build34-prod.aab = versionCode 34).
#
# beta: an APK for sideloading, signed with the release key when its secrets are set, else the shared dev key.
# prod: an AAB for Google Play, always signed with the release (upload) key: the run fails without its secrets
#       or if the bundle came out signed with the dev key. Download it from the run and upload it in the Play
#       Console by hand. See docs/play-store.md.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'beta = APK for testers (sideload); prod = signed AAB for Google Play'
        type: choice
        options: [beta, prod]
        default: beta

env:
  PROJECT: SideGigPh.Maui/SideGigPh.Maui.csproj
  BUILD_NUMBER: ${{ github.run_number }}
  PACKAGE_FORMAT: ${{ inputs.channel == 'prod' && 'aab' || 'apk' }}
  # The shared dev key's SHA-1 (docs/android-signing.md): a prod bundle signed with it is refused.
  DEV_KEY_SHA1: A5:F0:C9:6E:1D:B3:FC:85:E7:2E:6C:98:4F:D4:03:1A:D5:C3:31:B6

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the version is counted from the merged PRs (.github/scripts/app-version.sh)

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI workloads
        run: dotnet workload restore ${{ env.PROJECT }}

      # The label people and error reports see (0.1.0; 0.1.0-rc.12 while AppVersionStage is rc), read from
      # Directory.Build.props through a plain project.
      - name: Read the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}   # app-version.sh reads the merged PRs' minor / major labels
        run: |
          version="$(bash .github/scripts/app-version.sh)"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          label="$(dotnet msbuild SideGigPh.Contracts/SideGigPh.Contracts.csproj -getProperty:AppVersionLabel -p:BuildNumber=$BUILD_NUMBER -p:AppVersionNumber=$version)"
          if [ -z "$label" ]; then echo "::error::No AppVersionLabel (Directory.Build.props)"; exit 1; fi
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "### Tarbaho $label (${{ inputs.channel }}, build $BUILD_NUMBER, commit ${GITHUB_SHA::7})" >> "$GITHUB_STEP_SUMMARY"

      # The run's summary page lists the PRs added since the last successful build, each linked for the details.
      - name: List what's new since the last build
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/build-notes.sh >> "$GITHUB_STEP_SUMMARY"

      # google-services.json is git-ignored; without it Firebase sign-in can't start.
      - name: Write google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON_BASE64 is missing (see docs/android-signing.md)"; exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > SideGigPh.Maui/Platforms/Android/google-services.json

      # The release (upload) key. beta: optional, without it the APK is signed with the committed shared dev key,
      # whose fingerprint is registered in Firebase, so sign-in still works on sideloaded test APKs.
      # prod: required, a store build is never signed with the public dev key.
      - name: Write release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "SIDEGIGPH_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
          if [ "${{ inputs.channel }}" = "prod" ]; then
            for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
              if [ -z "${!name}" ]; then
                echo "::error::Secret $name is missing: a prod build must be signed with the upload key (docs/play-store.md)"; exit 1
              fi
            done
          elif [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret: signing with the shared dev key"
          fi

      - name: Build Android ${{ env.PACKAGE_FORMAT }}
        env:
          SIDEGIGPH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SIDEGIGPH_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SIDEGIGPH_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          dotnet publish ${{ env.PROJECT }} -f net10.0-android -c Release -p:AndroidPackageFormat=${{ env.PACKAGE_FORMAT }}
          -p:BuildNumber=${{ env.BUILD_NUMBER }} -p:AppVersionNumber=${{ env.APP_VERSION }} -p:AppChannel=${{ inputs.channel }}
          -o ${{ github.workspace }}/output/android

      # Which key signed it, on the run page; a prod bundle signed with the dev key stops here.
      - name: Check the signing key
        id: package
        run: |
          signed="$(ls output/android/*-Signed.${PACKAGE_FORMAT} | head -n 1)"
          if [ -z "$signed" ]; then echo "::error::No signed .${PACKAGE_FORMAT} in output/android"; exit 1; fi
          # The build number (= Android versionCode) in the file name, so an older download is never uploaded by mistake.
          file="output/android/tarbaho-${{ steps.version.outputs.label }}-build${BUILD_NUMBER}-${{ inputs.channel }}.${PACKAGE_FORMAT}"
          mv "$signed" "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          sha1="$(keytool -printcert -jarfile "$file" | awk '/SHA1:/ {print $2; exit}')"
          echo "Signed with SHA-1 \`$sha1\` ($(basename "$file"))" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ inputs.channel }}" = "prod" ] && [ "$sha1" = "$DEV_KEY_SHA1" ]; then
            echo "::error::The prod bundle is signed with the shared dev key, not the upload key"; exit 1
          fi

      - name: Upload Android ${{ env.PACKAGE_FORMAT }}
        uses: actions/upload-artifact@v4
        with:
          name: tarbaho-${{ steps.version.outputs.label }}-build${{ env.BUILD_NUMBER }}-${{ inputs.channel }}-android
          path: ${{ steps.package.outputs.file }}

      # R8 (csproj, Release) renames the Java side's private members; mapping.txt turns crash stacks back into real
      # names. Kept with the build: upload it in the Play Console with the bundle (App bundle explorer → Downloads →
      # ReTrace mapping file). No mapping means R8 didn't run: stop.
      - name: Find the R8 mapping
        id: mapping
        run: |
          mapping="$(find SideGigPh.Maui/bin/Release -name mapping.txt -path '*android*' | head -n 1)"
          if [ -z "$mapping" ]; then echo "::error::No R8 mapping.txt: R8 didn't run (AndroidLinkTool in the csproj)"; exit 1; fi
          echo "file=$mapping" >> "$GITHUB_OUTPUT"
          echo "R8 mapping: $(wc -l < "$mapping") lines" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: tarbaho-${{ steps.version.outputs.label }}-build${{ env.BUILD_NUMBER }}-${{ inputs.channel }}-r8-mapping
          path: ${{ steps.mapping.outputs.file }}
