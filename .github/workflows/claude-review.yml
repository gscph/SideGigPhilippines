name: Claude review

# Reviews every pull request to main with Claude (Opus 5.5, medium effort) and posts ONE comment on the PR:
# findings worst first, each with its evidence, or a plain "nothing found". Its main job is to catch a PR that
# breaks a core feature (onboarding, search, posting and offers, chat). It reads code only: tests.yml runs the
# tests, and nothing here builds the app. It also labels a PR that has no version label minor or major (a patch
# gets no label) and never changes a label already there.
# Needs ONE repo secret: CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`, billed to that Claude plan) or
# ANTHROPIC_API_KEY (billed per token to the API account). Without either, the job fails and nothing else changes.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        env:
          # gh (used only to read the PR and post the one comment) signs in with this run's token.
          GH_TOKEN: ${{ github.token }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # --effort medium is the CLI's documented flag (Opus 5.5's default today; pinned so it stays medium).
          claude_args: >-
            --model claude-opus-5-5
            --effort medium
            --max-turns 60
            --allowedTools "Read,Glob,Grep,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(gh pr comment:*),Bash(gh pr edit ${{ github.event.pull_request.number }} --add-label minor),Bash(gh pr edit ${{ github.event.pull_request.number }} --add-label major)"
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            BASE: origin/${{ github.event.pull_request.base.ref }}

            You review this pull request for SideGigPh (the "Tarbaho" app: .NET MAUI Blazor Hybrid app, Azure Functions
            API, Azure SQL). Your main job: make sure this PR does not break the core features. Read CLAUDE.md first
            (its hard rules), and the sections of docs/architecture.md for the areas the PR touches.

            Get the change with `gh pr view ${{ github.event.pull_request.number }}` and
            `git diff origin/${{ github.event.pull_request.base.ref }}...HEAD`, then read the surrounding code and its
            callers. Do NOT build the app or run tests: tests.yml already runs SideGigPh.Tests on pull requests, and
            the MAUI app can't build here. You only read code.

            Check, in this order:
            1. The PR's own changes: correctness bugs (wrong logic, null/empty cases, off-by-one, async misuse, a
               changed contract/JSON field or error code the other side still expects, a missing [JsonSerializable]
               line in ApiJson, a store rule the server no longer enforces).
            2. Whether the core features still work end to end, following the code paths the PR touches:
               - Onboarding: language -> sign-in (phone first, Google) -> role -> interview (Services/OnboardingSteps,
                 LaunchRouter) -> a worker's selfie, number, promises and Publish; a Seeker's search-or-post finish.
                 Onboarding must never loop or block on a missing option.
               - Search relevance and ranking: SearchRanker (exact job, your town then nearby, 0-100 score, workers
                 over budget lower but never hidden), SearchIntentParser / SearchText, "Others" text matching.
               - Job posting and offers: JobBoard, JobPostStore, JobAlerts, offers, pick -> chat, phone numbers
                 private until a pick, the household's point never sent.
               - Chat: ChatHistory, the chats API, only the Seeker starts a chat, InboxPages, PickedJobCard.
            3. CLAUDE.md hard rules:
               - Anti-fraud: 1 phone = 1 registration (number always from the token); duplicate photos refused
                 across Users, Professionals and ProfessionalWorkPhotos.
               - Schema: only a new guarded NNN-schema-*.sql (each step checked first, recorded in SchemaChanges,
                 added to SchemaScripts.Required); 001-schema.sql never edited; SideGigPhDb.cs matches.
               - .razor: MudBlazor only, no raw HTML, no hex colors; .razor + .razor.cs code-behind.
               - Copy: every user-facing string a LocalizedText(English, Taglish) pair in Copy.cs (or CommonCopy);
                 no job/hire/employment/"minimum wage" words; never vouches for a worker.
               - Server: token check first; the uid from the token, never the body; private data (a worker's base
                 point, phone numbers, ID documents) never sent to another phone or logged.

            Report only real problems you can show. Skip style nits and things tests.yml would already catch.
            Every finding needs EVIDENCE: the file and line (path:line), the few lines of code quoted, and a
            concrete failure scenario (who does what, what goes wrong). Without evidence, leave it out.

            Version label (the app's version is counted from these labels when the PR is squashed into main; see
            "Versioning" in docs/architecture.md and .github/scripts/app-version.sh):
            - major: a breaking change or a milestone (an old app stops working with the new API, a contract or
              saved format changed without a fallback, a big launch step).
            - minor: a feature or change people using the app will notice (a new screen, question, option or flow).
            - patch: anything smaller (a fix, copy tweak, refactor, tests, docs, CI). Patch is NO label.
            Read the PR's current labels (`gh pr view ${{ github.event.pull_request.number }} --json labels`).
            If it has neither minor nor major, add yours with exactly
            `gh pr edit ${{ github.event.pull_request.number }} --add-label minor` (or `major`); for a patch add
            nothing. If it already has minor or major, never change it (the owner may have set it); if you
            disagree, say so in the comment.

            Post exactly ONE comment, as your last step, with a heredoc so quotes in the text are safe:
            gh pr comment ${{ github.event.pull_request.number }} --body-file - <<'REVIEW'
            ...the comment...
            REVIEW
            Write it in plain words, this shape:

            ## Claude review
            One line: what the PR changes, and the verdict ("No problems found" or "N problems found").
            One line: **Version:** major / minor / patch, why in a few words, and what you did (added the label,
            kept the existing one, or no label for a patch).
            Then the findings, worst first (Breaks a core feature > Bug > Hard rule broken > Risk), each:
            ### 1. <Severity>: <short title>
            **Where:** `path:line`
            **Evidence:** quoted code + what happens
            **Fix:** one or two sentences
            Then a short "Checked" line naming the core features you followed and found fine.

            When nothing was found, say so clearly: "No problems found" and the Checked line.
