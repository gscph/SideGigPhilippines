name: Deploy API (Azure Functions)

# Builds SideGigPh.Api (with the operator site, SideGigPh.Admin, at …/api/operator/) and deploys it to the Function
# App SideGigPhApi. Manual only (Actions → Run workflow): merging to main deploys nothing. Tests run locally before
# each PR (the pr-qa / run-tests skills), not here.
#
#   plan: did the SQL scripts or the migration tool change since the commit the live API runs?
#     → no:  deploy (the database is not touched or even asked)
#     → yes: database.yml (db-check, then db-migrate if scripts are pending), then deploy; a script that fails
#            stops the run and the API does NOT deploy. So an API never goes live before the tables it needs.
# The SQL scripts alone (and 004-config.sql, by hand) are database.yml's.
#
# Signs in to Azure with OpenID Connect as the managed identity "sidegigph-github-deploy" (trusted for runs from main):
# no password or publish profile anywhere. Secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# (azure/cloudshell-github-deploy.sh, azure/README.md).

on:
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  id-token: write   # lets the run ask GitHub for the OIDC token Azure trusts
  contents: read

env:
  PROJECT: SideGigPh.Api/SideGigPh.Api.csproj
  FUNCTION_APP: SideGigPhApi
  # azure/cloudshell-setup.sh creates the app on the Flex Consumption plan. If your app is on the
  # classic Consumption or a Premium/App Service plan, set this to '' (empty).
  FUNCTION_SKU: flexconsumption

jobs:
  # Does the database need a look first? Compared with what is live, not with the last push, so a database run that
  # failed or never happened is still caught.
  plan:
    runs-on: ubuntu-latest
    outputs:
      database: ${{ steps.decide.outputs.database }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        run: |
          database="$(bash .github/scripts/changed.sh database live-api)"
          echo "database=$database" >> "$GITHUB_OUTPUT"
          if [ "$database" = "true" ]; then
            echo "::notice::SQL scripts changed since the live API's commit: checking the database before deploying."
          else
            echo "::notice::No SQL change since the live API's commit: deploying without touching the database."
          fi

  database:
    needs: plan
    if: needs.plan.outputs.database == 'true'
    uses: ./.github/workflows/database.yml
    secrets: inherit

  deploy:
    needs: [plan, database]
    # Only once the database is up to date: nothing changed there, or database.yml checked (and migrated) it.
    if: ${{ always() && needs.plan.result == 'success' && (needs.database.result == 'success' || (needs.database.result == 'skipped' && needs.plan.outputs.database == 'false')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        # The API's version: Directory.Build.props plus this run's number (0.1.0-rc.57), sent on every answer as X-Api-Version.
        run: dotnet publish ${{ env.PROJECT }} -c Release -p:BuildNumber=${{ github.run_number }} -o ${{ github.workspace }}/output/api

      - name: Publish the operator site into the API
        # SideGigPh.Admin (Blazor WebAssembly) is static files; OperatorSiteFunctions serves them from operator-site/
        # at …/api/operator/, so the page and the API share one origin (no CORS).
        run: |
          dotnet publish SideGigPh.Admin/SideGigPh.Admin.csproj -c Release -o ${{ github.workspace }}/output/admin
          rm -rf ${{ github.workspace }}/output/api/operator-site
          cp -r ${{ github.workspace }}/output/admin/wwwroot ${{ github.workspace }}/output/api/operator-site
          test -f ${{ github.workspace }}/output/api/operator-site/index.html

      - name: Sign in to Azure (OIDC, managed identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP }}
          package: ${{ github.workspace }}/output/api
          sku: ${{ env.FUNCTION_SKU }}
