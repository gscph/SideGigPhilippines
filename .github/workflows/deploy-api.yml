name: Deploy API (Azure Functions)

# Builds SideGigPh.Api and deploys it to the Function App SideGigPhApi. Runs on its own when a push to main
# changes the server's code (the API, its stores, the shared contracts, the legal pages it serves, or this file), and by hand (Actions → Run
# workflow). Changes to the SQL scripts don't deploy: run a new schema script on the database before pushing the
# API that needs it. Signs in to Azure with OpenID Connect as the managed identity "sidegigph-github-deploy": no password or
# publish profile anywhere. Needs three repo secrets, printed by azure/cloudshell-github-deploy.sh:
# AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (see azure/README.md → "Automatic deploy from GitHub").
# The identity trusts runs from the main branch only.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'SideGigPh.Api/**'
      - 'SideGigPh.AzureSQL/**'
      - '!SideGigPh.AzureSQL/Sql/**'
      - 'SideGigPh.Contracts/**'
      - 'docs/legal/privacy-policy.md'
      - 'docs/legal/terms-of-service.md'
      - 'docs/legal/data-handling.md'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - '.github/workflows/deploy-api.yml'

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  id-token: write   # lets the run ask GitHub for the OIDC token Azure trusts
  contents: read

env:
  PROJECT: SideGigPh.Api/SideGigPh.Api.csproj
  FUNCTION_APP: SideGigPhApi
  # azure/cloudshell-setup.sh creates the app on the Flex Consumption plan. If your app is on the
  # classic Consumption or a Premium/App Service plan, set this to '' (empty).
  FUNCTION_SKU: flexconsumption

jobs:
  # Nothing is deployed unless every test passes (tests.yml: unit + integration on a real SQL Server).
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the Azure sign-in secrets
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=""
          [ -z "$CLIENT_ID" ] && missing="$missing AZURE_CLIENT_ID"
          [ -z "$TENANT_ID" ] && missing="$missing AZURE_TENANT_ID"
          [ -z "$SUBSCRIPTION_ID" ] && missing="$missing AZURE_SUBSCRIPTION_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (paste azure/cloudshell-github-deploy.sh, see azure/README.md)"; exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        # The API's version: Directory.Build.props plus this run's number (0.1.0-rc.57), sent on every answer as X-Api-Version.
        run: dotnet publish ${{ env.PROJECT }} -c Release -p:BuildNumber=${{ github.run_number }} -o ${{ github.workspace }}/output/api

      - name: Sign in to Azure (OIDC, managed identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP }}
          package: ${{ github.workspace }}/output/api
          sku: ${{ env.FUNCTION_SKU }}
