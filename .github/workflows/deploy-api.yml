name: Deploy API (Azure Functions)

# Brings the live Azure SQL database up to date, then builds SideGigPh.Api and deploys it to the Function App
# SideGigPhApi. Runs on its own when a push to main changes the server's code or its SQL scripts (the API, its stores
# and Sql/, the migration tool, the shared contracts, the legal pages it serves, the operator site it serves
# (SideGigPh.Admin, at …/api/operator/), or this file), and by hand.
#
#   tests → db-check (which scripts the live database hasn't had: a dry run, changes nothing; it also refuses an
#           edited 001-schema.sql, an unguarded step or a DROP TABLE: migration-check.sh)
#         → nothing pending: deploy
#         → schema scripts pending (new NNN-schema-*.sql): db-migrate runs them on the live database in number
#           order, each in its own transaction (all of it or none), then deploy. No approval step: merging the
#           script to main IS the approval. A script that fails stops the run and the API does NOT deploy.
#   004-config.sql (trades, jobs, answer lists) runs only when "Also run 004-config.sql" is ticked on a manual run.
#
# So an API never goes live before the tables it needs.
# Signs in to Azure with OpenID Connect as the managed identity "sidegigph-github-deploy" (trusted for runs from main):
# no password or publish profile anywhere. Needs (azure/README.md → "Database migrations from GitHub"):
#   repo secrets   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (azure/cloudshell-github-deploy.sh)
#   repo variables SQL_SERVER, SQL_DATABASE, SQL_RESOURCE_GROUP (optional: default sidegigph / SideGigPh / sidegigph)
#   the identity as a database user (db_ddladmin, db_datareader, db_datawriter) and SQL Server Contributor on the server

on:
  workflow_dispatch:
    inputs:
      run_config:
        description: 'Also run 004-config.sql (the trades, jobs and answer lists) on the live database'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'SideGigPh.Api/**'
      - 'SideGigPh.AzureSQL/**'
      - 'SideGigPh.Migrate/**'
      - 'SideGigPh.Contracts/**'
      - 'SideGigPh.Admin/**'
      - 'docs/legal/privacy-policy.md'
      - 'docs/legal/terms-of-service.md'
      - 'docs/legal/data-handling.md'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - '.github/workflows/deploy-api.yml'

concurrency:
  group: deploy-api
  cancel-in-progress: false

permissions:
  id-token: write   # lets the run ask GitHub for the OIDC token Azure trusts
  contents: read

env:
  PROJECT: SideGigPh.Api/SideGigPh.Api.csproj
  FUNCTION_APP: SideGigPhApi
  # azure/cloudshell-setup.sh creates the app on the Flex Consumption plan. If your app is on the
  # classic Consumption or a Premium/App Service plan, set this to '' (empty).
  FUNCTION_SKU: flexconsumption
  SQL_SERVER: ${{ vars.SQL_SERVER || 'sidegigph' }}
  SQL_DATABASE: ${{ vars.SQL_DATABASE || 'SideGigPh' }}
  SQL_RESOURCE_GROUP: ${{ vars.SQL_RESOURCE_GROUP || 'sidegigph' }}
  FIREWALL_RULE: github-deploy-${{ github.run_id }}-${{ github.run_attempt }}
  RUN_CONFIG: ${{ github.event_name == 'workflow_dispatch' && inputs.run_config }}

jobs:
  # Nothing is deployed unless every test passes (tests.yml: unit + integration on a real SQL Server).
  tests:
    uses: ./.github/workflows/tests.yml

  # What the live database is missing: a dry run of SideGigPh.Migrate. Reads only.
  db-check:
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
      scripts: ${{ steps.plan.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # migration-check compares 001-schema.sql with the commit before this push

      - name: Check the Azure sign-in secrets
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=""
          [ -z "$CLIENT_ID" ] && missing="$missing AZURE_CLIENT_ID"
          [ -z "$TENANT_ID" ] && missing="$missing AZURE_TENANT_ID"
          [ -z "$SUBSCRIPTION_ID" ] && missing="$missing AZURE_SUBSCRIPTION_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (paste azure/cloudshell-github-deploy.sh, see azure/README.md)"; exit 1
          fi

      - name: Check the scripts are safe for the live database
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          base="HEAD~1"
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then base="$BEFORE"; fi
          bash .claude/skills/db-migration/scripts/migration-check.sh "$base"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the migration tool
        run: dotnet build SideGigPh.Migrate/SideGigPh.Migrate.csproj -c Release -o ${{ github.workspace }}/output/migrate

      - name: Sign in to Azure (OIDC, managed identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Open the database firewall to this run
        run: |
          # Optional: needs "SQL Server Contributor" on the server. Without it the run still connects when the server
          # allows Azure services (GitHub's runners are Azure machines, like the Function App).
          ip=$(curl -fsS https://api.ipify.org)
          if az sql server firewall-rule create -g "$SQL_RESOURCE_GROUP" -s "$SQL_SERVER" -n "$FIREWALL_RULE-check" \
            --start-ip-address "$ip" --end-ip-address "$ip" --output none; then
            sleep 15   # a new rule takes a few seconds to apply
          else
            echo "::warning::Could not open the SQL firewall to this run (no SQL Server Contributor on the server). Trying anyway, which works when the server allows Azure services."
          fi

      - name: List the scripts the database hasn't had
        id: plan
        env:
          SQL_CONNECTION: Server=tcp:${{ env.SQL_SERVER }}.database.windows.net,1433;Database=${{ env.SQL_DATABASE }};Authentication=Active Directory Default;Encrypt=True;Connect Timeout=60;
        run: |
          config=""
          [ "$RUN_CONFIG" = "true" ] && config="--config"
          dotnet ${{ github.workspace }}/output/migrate/SideGigPh.Migrate.dll --sql SideGigPh.AzureSQL/Sql --dry-run $config

      - name: Close the database firewall
        if: always()
        run: az sql server firewall-rule delete -g "$SQL_RESOURCE_GROUP" -s "$SQL_SERVER" -n "$FIREWALL_RULE-check" --output none || true

  # Runs what db-check listed, straight on the live database: the new schema scripts (and 004-config when ticked).
  db-migrate:
    needs: db-check
    if: needs.db-check.outputs.pending == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: What will run
        run: |
          echo "::notice::Running on the live database: ${{ needs.db-check.outputs.scripts }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the migration tool
        run: dotnet build SideGigPh.Migrate/SideGigPh.Migrate.csproj -c Release -o ${{ github.workspace }}/output/migrate

      - name: Sign in to Azure (OIDC, managed identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Open the database firewall to this run
        run: |
          # Optional: needs "SQL Server Contributor" on the server. Without it the run still connects when the server
          # allows Azure services (GitHub's runners are Azure machines, like the Function App).
          ip=$(curl -fsS https://api.ipify.org)
          if az sql server firewall-rule create -g "$SQL_RESOURCE_GROUP" -s "$SQL_SERVER" -n "$FIREWALL_RULE-migrate" \
            --start-ip-address "$ip" --end-ip-address "$ip" --output none; then
            sleep 15   # a new rule takes a few seconds to apply
          else
            echo "::warning::Could not open the SQL firewall to this run (no SQL Server Contributor on the server). Trying anyway, which works when the server allows Azure services."
          fi

      - name: Run the scripts
        env:
          SQL_CONNECTION: Server=tcp:${{ env.SQL_SERVER }}.database.windows.net,1433;Database=${{ env.SQL_DATABASE }};Authentication=Active Directory Default;Encrypt=True;Connect Timeout=60;
        run: |
          config=""
          [ "$RUN_CONFIG" = "true" ] && config="--config"
          dotnet ${{ github.workspace }}/output/migrate/SideGigPh.Migrate.dll --sql SideGigPh.AzureSQL/Sql $config

      - name: Close the database firewall
        if: always()
        run: az sql server firewall-rule delete -g "$SQL_RESOURCE_GROUP" -s "$SQL_SERVER" -n "$FIREWALL_RULE-migrate" --output none || true

  deploy:
    needs: [db-check, db-migrate]
    # Only once the database is up to date: nothing was pending, or db-migrate ran it.
    if: always() && needs.db-check.result == 'success' && (needs.db-check.outputs.pending == 'false' || needs.db-migrate.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        # The API's version: Directory.Build.props plus this run's number (0.1.0-rc.57), sent on every answer as X-Api-Version.
        run: dotnet publish ${{ env.PROJECT }} -c Release -p:BuildNumber=${{ github.run_number }} -o ${{ github.workspace }}/output/api

      - name: Publish the operator site into the API
        # SideGigPh.Admin (Blazor WebAssembly) is static files; OperatorSiteFunctions serves them from operator-site/
        # at …/api/operator/, so the page and the API share one origin (no CORS).
        run: |
          dotnet publish SideGigPh.Admin/SideGigPh.Admin.csproj -c Release -o ${{ github.workspace }}/output/admin
          rm -rf ${{ github.workspace }}/output/api/operator-site
          cp -r ${{ github.workspace }}/output/admin/wwwroot ${{ github.workspace }}/output/api/operator-site
          test -f ${{ github.workspace }}/output/api/operator-site/index.html

      - name: Sign in to Azure (OIDC, managed identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP }}
          package: ${{ github.workspace }}/output/api
          sku: ${{ env.FUNCTION_SKU }}
