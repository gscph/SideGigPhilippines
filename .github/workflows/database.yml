name: Database (Azure SQL)

# Brings the live Azure SQL database up to date: runs the NNN-schema-*.sql scripts it hasn't had (SideGigPh.Migrate).
# Manual only: nothing runs on a push or a merge. Tests run locally before each PR (the pr-qa / run-tests skills).
#
#   by hand (Actions → Run workflow)
#       → db-check → (db-migrate), plus 004-config.sql (trades, jobs, answer lists) when "Also run 004-config.sql" is
#         ticked. It does not deploy the API: run "Deploy API" for that (it runs this workflow first when needed).
#   called by deploy-api.yml (SQL changed since the live API's commit)
#       → db-check → (db-migrate); the caller deploys afterwards
#
#   db-check: a dry run that lists what the live database hasn't recorded in dbo.SchemaChanges; changes nothing. It
#             first refuses an edited 001-schema.sql, an unguarded step or a DROP TABLE (migration-check.sh).
#   db-migrate: runs exactly that, in number order, each script in its own transaction (all or none). No approval
#             step: pressing Run workflow IS the approval. A script that fails stops everything after it.
#
# Signs in to Azure with OpenID Connect as the managed identity "sidegigph-github-deploy" (trusted for runs from main).
# Needs (azure/README.md → "Database migrations from GitHub"):
#   repo secrets   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID (azure/cloudshell-github-deploy.sh)
#   repo variables SQL_SERVER, SQL_DATABASE, SQL_RESOURCE_GROUP (optional: default sidegigph / SideGigPh / sidegigph)
#   the identity as a database user (db_ddladmin, db_datareader, db_datawriter) and SQL Server Contributor on the server

on:
  workflow_dispatch:
    inputs:
      run_config:
        description: 'Also run 004-config.sql (the trades, jobs and answer lists) on the live database'
        type: boolean
        default: false
  workflow_call:   # deploy-api.yml calls it before deploying

permissions:
  id-token: write   # lets the run ask GitHub for the OIDC token Azure trusts
  contents: read

env:
  SQL_SERVER: ${{ vars.SQL_SERVER || 'sidegigph' }}
  SQL_DATABASE: ${{ vars.SQL_DATABASE || 'SideGigPh' }}
  SQL_RESOURCE_GROUP: ${{ vars.SQL_RESOURCE_GROUP || 'sidegigph' }}
  FIREWALL_RULE: github-db-${{ github.run_id }}-${{ github.run_attempt }}
  RUN_CONFIG: ${{ github.event_name == 'workflow_dispatch' && inputs.run_config == true }}

jobs:
  # What the live database is missing: a dry run of SideGigPh.Migrate. Reads only.
  db-check:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
      scripts: ${{ steps.plan.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # migration-check compares 001-schema.sql with the commit the live API runs

      - name: Check the Azure sign-in secrets
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=""
          [ -z "$CLIENT_ID" ] && missing="$missing AZURE_CLIENT_ID"
          [ -z "$TENANT_ID" ] && missing="$missing AZURE_TENANT_ID"
          [ -z "$SUBSCRIPTION_ID" ] && missing="$missing AZURE_SUBSCRIPTION_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing secrets:$missing (paste azure/cloudshell-github-deploy.sh, see azure/README.md)"; exit 1
          fi

      - name: Check the scripts are safe for the live database
        run: |
          # Runs are by hand and may cover several merges: compare with what is live, not just the last commit.
          base="$(bash .github/scripts/changed.sh live-commit)"
          if [ -z "$base" ]; then
            base="HEAD~1"
            echo "::warning::The live API's commit is unknown: checking 001-schema.sql against the last commit only."
          fi
          bash .claude/skills/db-migration/scripts/migration-check.sh "$base"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the migration tool
        run: dotnet build SideGigPh.Migrate/SideGigPh.Migrate.csproj -c Release -o ${{ github.workspace }}/output/migrate

      - name: Sign in to Azure (OIDC, managed identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Open the database firewall to this run
        run: |
          # Optional: needs "SQL Server Contributor" on the server. Without it the run still connects when the server
          # allows Azure services (GitHub's runners are Azure machines, like the Function App).
          ip=$(curl -fsS https://api.ipify.org)
          if az sql server firewall-rule create -g "$SQL_RESOURCE_GROUP" -s "$SQL_SERVER" -n "$FIREWALL_RULE-check" \
            --start-ip-address "$ip" --end-ip-address "$ip" --output none; then
            sleep 15   # a new rule takes a few seconds to apply
          else
            echo "::warning::Could not open the SQL firewall to this run (no SQL Server Contributor on the server). Trying anyway, which works when the server allows Azure services."
          fi

      - name: List the scripts the database hasn't had
        id: plan
        env:
          SQL_CONNECTION: Server=tcp:${{ env.SQL_SERVER }}.database.windows.net,1433;Database=${{ env.SQL_DATABASE }};Authentication=Active Directory Default;Encrypt=True;Connect Timeout=60;
        run: |
          config=""
          [ "$RUN_CONFIG" = "true" ] && config="--config"
          dotnet ${{ github.workspace }}/output/migrate/SideGigPh.Migrate.dll --sql SideGigPh.AzureSQL/Sql --dry-run $config

      - name: Close the database firewall
        if: always()
        run: az sql server firewall-rule delete -g "$SQL_RESOURCE_GROUP" -s "$SQL_SERVER" -n "$FIREWALL_RULE-check" --output none || true

  # Runs what db-check listed, straight on the live database: the new schema scripts (and 004-config when ticked).
  db-migrate:
    needs: db-check
    if: needs.db-check.outputs.pending == 'true'
    concurrency:
      group: database-migrate
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: What will run
        run: |
          echo "::notice::Running on the live database: ${{ needs.db-check.outputs.scripts }}"

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build the migration tool
        run: dotnet build SideGigPh.Migrate/SideGigPh.Migrate.csproj -c Release -o ${{ github.workspace }}/output/migrate

      - name: Sign in to Azure (OIDC, managed identity)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Open the database firewall to this run
        run: |
          # Optional: needs "SQL Server Contributor" on the server. Without it the run still connects when the server
          # allows Azure services (GitHub's runners are Azure machines, like the Function App).
          ip=$(curl -fsS https://api.ipify.org)
          if az sql server firewall-rule create -g "$SQL_RESOURCE_GROUP" -s "$SQL_SERVER" -n "$FIREWALL_RULE-migrate" \
            --start-ip-address "$ip" --end-ip-address "$ip" --output none; then
            sleep 15   # a new rule takes a few seconds to apply
          else
            echo "::warning::Could not open the SQL firewall to this run (no SQL Server Contributor on the server). Trying anyway, which works when the server allows Azure services."
          fi

      - name: Run the scripts
        env:
          SQL_CONNECTION: Server=tcp:${{ env.SQL_SERVER }}.database.windows.net,1433;Database=${{ env.SQL_DATABASE }};Authentication=Active Directory Default;Encrypt=True;Connect Timeout=60;
        run: |
          config=""
          [ "$RUN_CONFIG" = "true" ] && config="--config"
          dotnet ${{ github.workspace }}/output/migrate/SideGigPh.Migrate.dll --sql SideGigPh.AzureSQL/Sql $config

      - name: Close the database firewall
        if: always()
        run: az sql server firewall-rule delete -g "$SQL_RESOURCE_GROUP" -s "$SQL_SERVER" -n "$FIREWALL_RULE-migrate" --output none || true
