name: Tests

# Runs SideGigPh.Tests (unit + integration) on every push and pull request to main that changes code the tests
# can see, and before every API deploy (deploy-api.yml calls this workflow). A change to only CSS, images, .razor
# markup or docs doesn't start it: those can't change a test result.
# The integration tests get a real SQL Server (a container next to the runner), built from
# SideGigPh.AzureSQL/Sql/001-schema.sql and every later NNN-schema-*.sql by the tests themselves.

on:
  push:
    branches: [main]
    paths:
      - 'SideGigPh.Maui/Models/**'
      - 'SideGigPh.Maui/Services/**'
      - 'SideGigPh.Maui/Components/**/*Routes.cs'
      - 'SideGigPh.Maui/GlobalUsings.cs'
      - 'SideGigPh.Maui/*.csproj'
      - 'SideGigPh.Api/**'
      - 'SideGigPh.AzureSQL/**'
      - 'SideGigPh.Contracts/**'
      - 'SideGigPh.Tests/**'
      - 'MobileAppTheme/**/*.cs'
      - 'MobileAppTheme/*.csproj'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'SideGigPh.Maui/Models/**'
      - 'SideGigPh.Maui/Services/**'
      - 'SideGigPh.Maui/Components/**/*Routes.cs'
      - 'SideGigPh.Maui/GlobalUsings.cs'
      - 'SideGigPh.Maui/*.csproj'
      - 'SideGigPh.Api/**'
      - 'SideGigPh.AzureSQL/**'
      - 'SideGigPh.Contracts/**'
      - 'SideGigPh.Tests/**'
      - 'MobileAppTheme/**/*.cs'
      - 'MobileAppTheme/*.csproj'
      - '.github/workflows/tests.yml'
  workflow_dispatch:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      sql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Tests-only-Passw0rd!'
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Tests-only-Passw0rd!' -Q 'SELECT 1' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 12
    env:
      # A throwaway server that exists only for this run; the password is not a secret.
      SIDEGIGPH_TEST_SQL: 'Server=localhost,1433;User Id=sa;Password=Tests-only-Passw0rd!;TrustServerCertificate=true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Run tests
        run: >-
          dotnet test SideGigPh.Tests/SideGigPh.Tests.csproj -c Release
          --logger "trx;LogFileName=results.trx"
          --collect "XPlat Code Coverage" --settings SideGigPh.Tests/coverage.runsettings
          --results-directory TestResults

      - name: Integration tests must not be skipped in CI
        run: |
          if grep -q 'outcome="NotExecuted"' TestResults/*.trx; then
            echo "::error::Some tests were skipped (no SQL Server?). See the test log."; exit 1
          fi

      - name: Coverage summary
        if: always()
        run: |
          report="$(ls TestResults/*/coverage.cobertura.xml | head -1)"
          awk -f .claude/skills/run-tests/scripts/coverage-summary.awk "$report" | sort -n | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
